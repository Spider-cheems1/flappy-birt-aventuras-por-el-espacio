<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#70c5ce" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%2370c5ce'/><ellipse cx='29' cy='33' rx='16' ry='13' fill='%23facc15' stroke='%231e293b' stroke-width='2.5'/><circle cx='35' cy='29' r='3.6' fill='%23ffffff' stroke='%231e293b' stroke-width='2'/><circle cx='36.3' cy='29' r='1.5' fill='%230f172a'/><polygon points='43,32 54,35 43,38' fill='%23f97316' stroke='%231e293b' stroke-width='2'/></svg>" />
  <title>Flappy Bird Aventuras Espaciales</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #1b2631;
      color: #ffffff;
      font-family: "Trebuchet MS", system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #game-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background: #70c5ce;
    }

    @media (min-aspect-ratio: 1/1) {
      #game-container {
        position: relative;
        top: auto;
        left: auto;
        width: min(430px, 54vh);
        height: 94dvh;
        border-radius: 24px;
        border: 3px solid #2c3e50;
        box-shadow: 0 22px 55px rgba(0, 0, 0, 0.55);
      }
    }

    #gameCanvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }

    .hud {
      position: absolute;
      top: max(14px, env(safe-area-inset-top));
      left: 14px;
      right: 14px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      pointer-events: none;
      z-index: 5;
    }

    .hud-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    #score {
      font-size: 48px;
      font-weight: 900;
      line-height: 1;
      color: #ffffff;
      -webkit-text-stroke: 2px #1e293b;
      text-shadow: 0 4px 0 #1e293b;
    }

    #phase-badge {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(30, 41, 59, 0.72);
      border: 2px solid #1e293b;
      color: #fef08a;
    }

    .hud-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: auto;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      border: 2px solid #1e293b;
      background: #f8fafc;
      color: #1e293b;
      font-size: 16px;
      font-weight: 900;
      box-shadow: 0 3px 0 #1e293b;
      display: grid;
      place-items: center;
      cursor: pointer;
    }

    .icon-btn:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #1e293b;
    }

    #start-hint {
      position: absolute;
      top: 56%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      padding: 14px 20px;
      border-radius: 14px;
      background: #fef9c3;
      border: 3px solid #1e293b;
      box-shadow: 0 4px 0 #1e293b;
      color: #1e293b;
      pointer-events: none;
      z-index: 6;
      width: min(82%, 290px);
    }

    #start-hint strong {
      display: block;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 0.03em;
      color: #15803d;
      margin-bottom: 3px;
    }

    #start-hint span {
      font-size: 13px;
      font-weight: 700;
      color: #334155;
    }

    #gameover-panel {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: rgba(15, 23, 42, 0.58);
      z-index: 10;
      padding: 24px;
      text-align: center;
    }

    #gameover-panel.show {
      display: flex;
    }

    #gameover-panel h2 {
      font-size: 32px;
      font-weight: 900;
      color: #f97316;
      -webkit-text-stroke: 1.5px #1e293b;
      text-shadow: 0 3px 0 #1e293b;
    }

    .stats-box {
      background: #ded895;
      border: 3px solid #1e293b;
      box-shadow: 0 5px 0 #1e293b;
      border-radius: 14px;
      padding: 16px 24px;
      min-width: 220px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 16px;
      font-weight: 800;
      color: #1e293b;
    }

    #restart-btn {
      padding: 12px 26px;
      border: 3px solid #1e293b;
      border-radius: 12px;
      background: #22c55e;
      color: #ffffff;
      font-size: 16px;
      font-weight: 900;
      box-shadow: 0 4px 0 #1e293b;
      cursor: pointer;
    }

    #restart-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #1e293b;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <div class="hud">
      <button id="pause-btn" class="icon-btn" aria-label="Pausa">II</button>

      <div class="hud-center">
        <div id="score">0</div>
        <div id="phase-badge">FASE 1 · DÍA CLÁSICO</div>
      </div>

      <div class="hud-actions">
        <button id="sound-btn" class="icon-btn" aria-label="Sonido">♪</button>
      </div>
    </div>

    <div id="start-hint">
      <strong>TOCA LA PANTALLA</strong>
      <span>Pulsa cualquier zona para volar</span>
    </div>

    <div id="gameover-panel">
      <h2>GAME OVER</h2>
      <div class="stats-box">
        <div>SCORE: <span id="final-score">0</span></div>
        <div>BEST: <span id="best-score">0</span></div>
      </div>
      <button id="restart-btn">PLAY AGAIN</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const phaseBadgeEl = document.getElementById("phase-badge");
    const startHintEl = document.getElementById("start-hint");
    const gameoverPanel = document.getElementById("gameover-panel");
    const finalScoreEl = document.getElementById("final-score");
    const bestScoreEl = document.getElementById("best-score");
    const restartBtn = document.getElementById("restart-btn");
    const pauseBtn = document.getElementById("pause-btn");
    const soundBtn = document.getElementById("sound-btn");

    function drawRoundRect(c, x, y, w, h, r) {
      const radius = Math.max(0, Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2));
      c.beginPath();
      c.moveTo(x + radius, y);
      c.lineTo(x + w - radius, y);
      c.quadraticCurveTo(x + w, y, x + w, y + radius);
      c.lineTo(x + w, y + h - radius);
      c.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
      c.lineTo(x + radius, y + h);
      c.quadraticCurveTo(x, y + h, x, y + h - radius);
      c.lineTo(x, y + radius);
      c.quadraticCurveTo(x, y, x + radius, y);
      c.closePath();
    }

    let width = 360;
    let height = 640;
    let dpr = Math.min(window.devicePixelRatio || 1, 2);
    const groundHeight = 84;

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      width = Math.max(240, rect.width);
      height = Math.max(360, rect.height);
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      bird.x = width * 0.28;
      if (state === "idle") {
        bird.y = (height - groundHeight) * 0.46;
      }
    }

    let state = "idle"; // idle | playing | paused | gameover
    let soundEnabled = true;
    let score = 0;
    let bestScore = Number(localStorage.getItem("flappy_aventuras_best") || 0);
    bestScoreEl.textContent = bestScore;

    const bird = {
      x: 100,
      y: 260,
      radius: 17,
      vy: 0,
      gravity: 0.42,
      flapImpulse: -7.6,
      rotation: 0
    };

    let pipes = [];
    let frameCount = 0;
    let scrollOffset = 0;
    const pipeWidth = 60;
    const pipeGap = 142;
    const pipeSpeed = 2.6;

    function playTone(freq, duration) {
      if (!soundEnabled) return;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioCtx();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "square";
        osc.frequency.value = freq;
        gain.gain.value = 0.04;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (_) {}
    }

    function updatePhaseBadge() {
      if (score >= 20) {
        phaseBadgeEl.textContent = "FASE 3 · NOCHE ESTELAR";
      } else if (score >= 10) {
        phaseBadgeEl.textContent = "FASE 2 · ATARDECER ESPACIAL";
      } else {
        phaseBadgeEl.textContent = "FASE 1 · DÍA CLÁSICO";
      }
    }

    function resetGame() {
      score = 0;
      scoreEl.textContent = "0";
      updatePhaseBadge();
      pipes = [];
      frameCount = 0;
      scrollOffset = 0;
      bird.y = (height - groundHeight) * 0.46;
      bird.vy = 0;
      bird.rotation = 0;
      gameoverPanel.classList.remove("show");
      startHintEl.style.display = "block";
      state = "idle";
    }

    function flap() {
      if (state === "paused" || state === "gameover") return;
      if (state === "idle") {
        state = "playing";
        startHintEl.style.display = "none";
      }
      bird.vy = bird.flapImpulse;
      playTone(580, 0.07);
    }

    function spawnPipe() {
      const playfieldH = height - groundHeight;
      const margin = 68;
      const maxTop = Math.max(margin + 28, playfieldH - pipeGap - margin);
      const topHeight = margin + Math.random() * (maxTop - margin);
      pipes.push({
        x: width + 24,
        top: topHeight,
        bottom: topHeight + pipeGap,
        passed: false
      });
    }

    function endGame() {
      if (state === "gameover") return;
      state = "gameover";
      playTone(165, 0.2);
      if (score > bestScore) {
        bestScore = score;
        localStorage.setItem("flappy_aventuras_best", String(bestScore));
      }
      finalScoreEl.textContent = score;
      bestScoreEl.textContent = bestScore;
      gameoverPanel.classList.add("show");
    }

    function update() {
      if (state !== "playing") {
        if (state === "idle") {
          frameCount++;
          bird.y = (height - groundHeight) * 0.46 + Math.sin(frameCount * 0.08) * 6;
        }
        return;
      }

      frameCount++;
      scrollOffset = (scrollOffset + pipeSpeed) % 48;
      bird.vy += bird.gravity;
      bird.y += bird.vy;
      bird.rotation = Math.max(-0.45, Math.min(1.15, bird.vy * 0.065));

      if (bird.y - bird.radius < 0) {
        bird.y = bird.radius;
        bird.vy = 0;
      }

      const groundTop = height - groundHeight;
      if (bird.y + bird.radius >= groundTop) {
        bird.y = groundTop - bird.radius;
        endGame();
        return;
      }

      if (frameCount % 96 === 0) {
        spawnPipe();
      }

      for (let i = pipes.length - 1; i >= 0; i--) {
        const p = pipes[i];
        p.x -= pipeSpeed;

        if (!p.passed && p.x + pipeWidth < bird.x) {
          p.passed = true;
          score++;
          scoreEl.textContent = score;
          updatePhaseBadge();
          playTone(820, 0.06);
        }

        const withinX = bird.x + bird.radius > p.x && bird.x - bird.radius < p.x + pipeWidth;
        const hitTop = bird.y - bird.radius < p.top;
        const hitBottom = bird.y + bird.radius > p.bottom;

        if (withinX && (hitTop || hitBottom)) {
          endGame();
          return;
        }

        if (p.x + pipeWidth < -40) {
          pipes.splice(i, 1);
        }
      }
    }

    function drawBackground() {
      const playfieldH = height - groundHeight;

      if (score >= 20) {
        ctx.fillStyle = "#0f172a";
      } else if (score >= 10) {
        ctx.fillStyle = "#38bdf8";
      } else {
        ctx.fillStyle = "#70c5ce";
      }
      ctx.fillRect(0, 0, width, playfieldH);

      // Nubes clásicas en la parte baja del cielo
      ctx.fillStyle = score >= 20 ? "rgba(148, 163, 184, 0.25)" : "#e0f7fa";
      const cloudBaseY = playfieldH - 36;
      const step = 96;
      const startX = -((scrollOffset * 0.4) % step) - step;
      for (let x = startX; x < width + step; x += step) {
        ctx.beginPath();
        ctx.arc(x + 20, cloudBaseY, 22, 0, Math.PI * 2);
        ctx.arc(x + 44, cloudBaseY - 10, 28, 0, Math.PI * 2);
        ctx.arc(x + 70, cloudBaseY, 20, 0, Math.PI * 2);
        ctx.fill();
      }

      // Silueta de ciudad clásica suave
      ctx.fillStyle = score >= 20 ? "#1e293b" : "#a3e4d7";
      const bStep = 64;
      const bStart = -((scrollOffset * 0.6) % bStep) - bStep;
      for (let x = bStart; x < width + bStep; x += bStep) {
        const bh = 42 + ((Math.abs(Math.floor((x + scrollOffset) / bStep)) * 17) % 36);
        ctx.fillRect(x + 4, playfieldH - bh, 46, bh);
      }

      // Suelo clásico (franja verde superior + tierra)
      ctx.fillStyle = "#ded895";
      ctx.fillRect(0, playfieldH, width, groundHeight);

      ctx.fillStyle = "#73bf2e";
      ctx.fillRect(0, playfieldH, width, 20);

      ctx.strokeStyle = "#1e293b";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, playfieldH);
      ctx.lineTo(width, playfieldH);
      ctx.moveTo(0, playfieldH + 20);
      ctx.lineTo(width, playfieldH + 20);
      ctx.stroke();

      // Diagonales clásicas del césped
      ctx.fillStyle = "#9ce659";
      const diagStep = 24;
      const dStart = -(scrollOffset % diagStep) - diagStep;
      for (let x = dStart; x < width + diagStep; x += diagStep) {
        ctx.beginPath();
        ctx.moveTo(x, playfieldH + 18);
        ctx.lineTo(x + 10, playfieldH + 2);
        ctx.lineTo(x + 18, playfieldH + 2);
        ctx.lineTo(x + 8, playfieldH + 18);
        ctx.closePath();
        ctx.fill();
      }
    }

    function drawPipeSegment(x, y, w, h, isCap) {
      if (h <= 0) return;
      ctx.fillStyle = "#73bf2e";
      ctx.fillRect(x, y, w, h);

      // Brillo vertical clásico
      ctx.fillStyle = "#9ce659";
      ctx.fillRect(x + 6, y, 8, h);

      // Sombra lateral clásica
      ctx.fillStyle = "#558c22";
      ctx.fillRect(x + w - 10, y, 10, h);

      ctx.strokeStyle = "#1e293b";
      ctx.lineWidth = 3;
      ctx.strokeRect(x, y, w, h);

      if (isCap) {
        ctx.strokeRect(x, y, w, h);
      }
    }

    function drawPipes() {
      const capH = 26;
      const capOverhang = 5;

      for (const p of pipes) {
        // Tubería superior
        const bodyTopH = Math.max(0, p.top - capH);
        drawPipeSegment(p.x, 0, pipeWidth, bodyTopH, false);
        drawPipeSegment(p.x - capOverhang, Math.max(0, p.top - capH), pipeWidth + capOverhang * 2, Math.min(capH, p.top), true);

        // Tubería inferior
        const bottomAreaH = Math.max(0, height - groundHeight - p.bottom);
        const capBottomH = Math.min(capH, bottomAreaH);
        drawPipeSegment(p.x - capOverhang, p.bottom, pipeWidth + capOverhang * 2, capBottomH, true);
        if (bottomAreaH > capBottomH) {
          drawPipeSegment(p.x, p.bottom + capBottomH, pipeWidth, bottomAreaH - capBottomH, false);
        }
      }
    }

    function drawBird() {
      ctx.save();
      ctx.translate(bird.x, bird.y);
      ctx.rotate(bird.rotation);

      // Cuerpo amarillo clásico
      ctx.fillStyle = "#facc15";
      ctx.strokeStyle = "#1e293b";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.ellipse(0, 0, bird.radius + 2, bird.radius - 1, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // Ala animada
      const wingOffsetY = Math.sin(frameCount * 0.35) * 3.5;
      ctx.fillStyle = "#fef08a";
      ctx.beginPath();
      ctx.ellipse(-5, 2 + wingOffsetY * 0.4, 8, 5.5, -0.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // Ojo blanco y pupila
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(6.5, -4.5, 5.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "#1e293b";
      ctx.beginPath();
      ctx.arc(8.2, -4.5, 2.3, 0, Math.PI * 2);
      ctx.fill();

      // Pico naranja clásico
      ctx.fillStyle = "#f97316";
      ctx.beginPath();
      ctx.moveTo(6, 1);
      ctx.lineTo(18, 4.5);
      ctx.lineTo(6, 9);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.restore();
    }

    function loop() {
      update();
      drawBackground();
      drawPipes();
      drawBird();
      requestAnimationFrame(loop);
    }

    canvas.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      flap();
    });

    window.addEventListener("keydown", (e) => {
      if (e.code === "Space" || e.code === "ArrowUp") {
        e.preventDefault();
        flap();
      }
    });

    pauseBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      if (state === "playing") {
        state = "paused";
        pauseBtn.textContent = "▶";
      } else if (state === "paused") {
        state = "playing";
        pauseBtn.textContent = "II";
      }
    });

    soundBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      soundEnabled = !soundEnabled;
      soundBtn.textContent = soundEnabled ? "♪" : "✕";
    });

    restartBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      pauseBtn.textContent = "II";
      resetGame();
    });

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();
    loop();

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
