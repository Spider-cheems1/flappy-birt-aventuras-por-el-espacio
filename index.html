<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#090d16">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Flappy AI: Odisea Espacial</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/svg+xml" href="./icon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            touch-action: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background-color: #090d16;
            font-family: 'Inter', sans-serif;
        }
        #game-container {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1;
        }
        #gameCanvas {
            position: fixed;
            inset: 0;
            display: block;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            z-index: 1;
        }
        #top-ui {
            padding-top: max(0.85rem, env(safe-area-inset-top));
            padding-bottom: 0.5rem;
            padding-left: max(0.85rem, env(safe-area-inset-left));
            padding-right: max(0.85rem, env(safe-area-inset-right));
        }
        #start-hint {
            top: 56%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        .font-cyber {
            font-family: 'Orbitron', sans-serif;
        }
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 15px rgba(56, 189, 248, 0.4); }
            50% { box-shadow: 0 0 28px rgba(56, 189, 248, 0.8); }
        }
        .cyber-panel {
            background: rgba(15, 23, 42, 0.78);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(56, 189, 248, 0.35);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
        }
        .cyber-btn {
            background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
            border: 1px solid rgba(125, 211, 252, 0.5);
            transition: transform 0.15s ease, filter 0.15s ease;
        }
        .cyber-btn:active {
            transform: scale(0.95);
            filter: brightness(1.15);
        }
        .phase-banner {
            transition: opacity 0.6s ease, transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <div id="top-ui" class="absolute top-0 left-0 w-full flex justify-between items-start gap-2 pointer-events-none z-20">
        <button id="btn-pause" aria-label="Pausar juego" class="pointer-events-auto w-11 h-11 sm:w-12 sm:h-12 shrink-0 rounded-2xl cyber-panel flex items-center justify-center text-sky-300 hover:text-white active:scale-90 transition-all shadow-lg">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 sm:w-6 sm:h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10 9v6m4-6v6" />
            </svg>
        </button>

        <div class="flex flex-col items-center min-w-0 flex-1 max-w-[65vw]">
            <div id="score-display" class="font-cyber text-3xl sm:text-5xl font-black text-white tracking-wider drop-shadow-[0_2px_10px_rgba(56,189,248,0.6)]">
                0
            </div>
            <div id="phase-indicator" class="max-w-full truncate text-[10px] sm:text-xs font-semibold uppercase tracking-wider text-sky-300/90 mt-1 px-2.5 py-0.5 rounded-full bg-slate-900/60 border border-sky-400/20">
                Fase 1 · Campo Soleado
            </div>

            <div id="boss-hud" class="hidden mt-2.5 w-48 sm:w-72 cyber-panel rounded-2xl p-2 flex flex-col items-center">
                <div class="w-full flex justify-between items-center text-[10px] sm:text-[11px] font-cyber font-bold text-rose-400 mb-1">
                    <span class="truncate">JEFE OVNI · BIGOTES</span>
                    <span id="boss-hp-text" class="shrink-0 ml-1">100 / 100 HP</span>
                </div>
                <div class="w-full h-2.5 sm:h-3 bg-slate-950 rounded-full overflow-hidden border border-rose-500/40 p-0.5">
                    <div id="boss-hp-bar" class="h-full bg-gradient-to-r from-rose-600 via-orange-500 to-amber-400 rounded-full transition-all duration-300" style="width: 100%;"></div>
                </div>
            </div>
        </div>

        <div class="flex flex-col gap-2 shrink-0 pointer-events-auto">
            <button id="btn-menu-dots" aria-label="Información y créditos" class="w-11 h-11 sm:w-12 sm:h-12 rounded-2xl cyber-panel flex items-center justify-center text-sky-300 hover:text-white active:scale-90 transition-all shadow-lg">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 sm:w-6 sm:h-6" fill="currentColor" viewBox="0 0 24 24">
                    <circle cx="12" cy="5" r="2.2" />
                    <circle cx="12" cy="12" r="2.2" />
                    <circle cx="12" cy="19" r="2.2" />
                </svg>
            </button>
            <button id="btn-sound" aria-label="Alternar sonido" class="w-11 h-11 sm:w-12 sm:h-12 rounded-2xl cyber-panel flex items-center justify-center text-sky-300 hover:text-white active:scale-90 transition-all shadow-lg">
                <svg id="icon-sound-on" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
                </svg>
                <svg id="icon-sound-off" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 hidden text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15zM17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2" />
                </svg>
            </button>
        </div>
    </div>

    <div id="phase-banner" class="phase-banner pointer-events-none absolute top-28 sm:top-32 left-1/2 -translate-x-1/2 opacity-0 -translate-y-4 z-10 text-center w-[90vw] max-w-xs">
        <div class="cyber-panel rounded-2xl px-4 py-2.5 border-sky-400/50">
            <p id="banner-subtitle" class="text-[10px] font-cyber uppercase tracking-widest text-cyan-400">NUEVA ZONA ALCANZADA</p>
            <h2 id="banner-title" class="font-cyber text-base sm:text-xl font-bold text-white mt-0.5 leading-snug">CAMPO DE NOCHE</h2>
        </div>
    </div>

    <div id="start-hint" class="pointer-events-none fixed z-10 flex flex-col items-center text-center w-[86vw] max-w-[18rem]">
        <div class="cyber-panel rounded-2xl px-5 py-3.5 border-cyan-400/70">
            <p class="font-cyber text-sm sm:text-base font-bold text-cyan-300 tracking-wide">TOCA LA PANTALLA</p>
            <p class="text-xs sm:text-sm text-slate-200 mt-1">Pulsa cualquier zona para volar</p>
        </div>
    </div>

    <div id="modal-pause" class="hidden absolute inset-0 bg-slate-950/75 backdrop-blur-md z-30 flex items-center justify-center p-4">
        <div class="cyber-panel rounded-3xl p-6 w-full max-w-[20rem] text-center">
            <div class="w-14 h-14 rounded-2xl bg-sky-500/20 border border-sky-400/40 flex items-center justify-center mx-auto mb-4 text-sky-300">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10 9v6m4-6v6" />
                </svg>
            </div>
            <h2 class="font-cyber text-xl sm:text-2xl font-bold text-white mb-1">JUEGO PAUSADO</h2>
            <p class="text-xs text-slate-400 mb-6">Tómate un respiro, piloto</p>
            <div class="flex flex-col gap-3">
                <button id="btn-resume" class="cyber-btn w-full py-3.5 rounded-2xl font-cyber font-bold text-white text-sm tracking-wider shadow-lg">
                    REANUDAR
                </button>
                <button id="btn-restart-pause" class="w-full py-3.5 rounded-2xl bg-slate-800/90 hover:bg-slate-700 border border-slate-600/50 font-cyber font-semibold text-slate-200 text-sm tracking-wider transition">
                    REINICIAR
                </button>
            </div>
        </div>
    </div>

    <div id="modal-dots" class="hidden absolute inset-0 bg-slate-950/75 backdrop-blur-md z-30 flex items-center justify-center p-4">
        <div class="cyber-panel rounded-3xl p-6 w-full max-w-[20rem] text-center relative">
            <div class="w-16 h-16 rounded-full bg-gradient-to-tr from-cyan-500 via-blue-500 to-fuchsia-500 p-0.5 mx-auto mb-4 shadow-lg">
                <div class="w-full h-full bg-slate-900 rounded-full flex items-center justify-center">
                    <svg class="w-8 h-8 text-cyan-300" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89
