<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#070b19" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23070b19'/><ellipse cx='30' cy='33' rx='15' ry='12' fill='%2338bdf8'/><circle cx='36' cy='29' r='3.5' fill='%23ffffff'/><circle cx='37.2' cy='29' r='1.5' fill='%23070b19'/><polygon points='43,32 53,35 43,38' fill='%23fbbf24'/></svg>" />
  <title>Flappy Bird Aventuras Espaciales</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #050811;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #game-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background: linear-gradient(180deg, #050814 0%, #0f172a 55%, #1e1b4b 100%);
    }

    @media (min-aspect-ratio: 1/1) {
      #game-container {
        position: relative;
        top: auto;
        left: auto;
        width: min(440px, 54vh);
        height: 94dvh;
        border-radius: 26px;
        border: 2px solid rgba(129, 140, 248, 0.4);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.75);
      }
    }

    #gameCanvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }

    .hud {
      position: absolute;
      top: max(14px, env(safe-area-inset-top));
      left: 14px;
      right: 14px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      pointer-events: none;
      z-index: 5;
    }

    .hud-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    #score {
      font-size: 44px;
      font-weight: 900;
      line-height: 1;
      color: #ffffff;
      text-shadow: 0 0 18px rgba(56, 189, 248, 0.55), 0 3px 10px rgba(0, 0, 0, 0.7);
    }

    #phase-badge {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.78);
      border: 1px solid rgba(129, 140, 248, 0.35);
      color: #c7d2fe;
    }

    .hud-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: auto;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      border: 1px solid rgba(148, 163, 184, 0.3);
      background: rgba(15, 23, 42, 0.78);
      color: #f8fafc;
      font-size: 16px;
      font-weight: 700;
      display: grid;
      place-items: center;
      cursor: pointer;
    }

    #start-hint {
      position: absolute;
      top: 56%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      padding: 16px 22px;
      border-radius: 18px;
      background: rgba(15, 23, 42, 0.86);
      border: 1px solid rgba(56, 189, 248, 0.4);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
      pointer-events: none;
      z-index: 6;
      width: min(82%, 300px);
    }

    #start-hint strong {
      display: block;
      font-size: 17px;
      letter-spacing: 0.04em;
      color: #7dd3fc;
      margin-bottom: 4px;
    }

    #start-hint span {
      font-size: 13px;
      color: #cbd5e1;
    }

    #gameover-panel {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: rgba(5, 8, 20, 0.76);
      backdrop-filter: blur(4px);
      z-index: 10;
      padding: 24px;
      text-align: center;
    }

    #gameover-panel.show {
      display: flex;
    }

    #gameover-panel h2 {
      font-size: 28px;
      color: #f472b6;
    }

    .stats-box {
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(129, 140, 248, 0.35);
      border-radius: 16px;
      padding: 14px 22px;
      min-width: 210px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 15px;
    }

    #restart-btn {
      padding: 12px 24px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      color: #050814;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <div class="hud">
      <button id="pause-btn" class="icon-btn" aria-label="Pausa">II</button>

      <div class="hud-center">
        <div id="score">0</div>
        <div id="phase-badge">FASE 1 · NEBULOSA INICIAL</div>
      </div>

      <div class="hud-actions">
        <button id="sound-btn" class="icon-btn" aria-label="Sonido">♪</button>
      </div>
    </div>

    <div id="start-hint">
      <strong>TOCA LA PANTALLA</strong>
      <span>Pulsa cualquier zona para volar</span>
    </div>

    <div id="gameover-panel">
      <h2>¡FIN DE LA ODISEA!</h2>
      <div class="stats-box">
        <div>Puntos: <strong id="final-score">0</strong></div>
        <div>Récord: <strong id="best-score">0</strong></div>
      </div>
      <button id="restart-btn">JUGAR DE NUEVO</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const phaseBadgeEl = document.getElementById("phase-badge");
    const startHintEl = document.getElementById("start-hint");
    const gameoverPanel = document.getElementById("gameover-panel");
    const finalScoreEl = document.getElementById("final-score");
    const bestScoreEl = document.getElementById("best-score");
    const restartBtn = document.getElementById("restart-btn");
    const pauseBtn = document.getElementById("pause-btn");
    const soundBtn = document.getElementById("sound-btn");

    function drawRoundRect(c, x, y, w, h, r) {
      const radius = Math.max(0, Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2));
      c.beginPath();
      c.moveTo(x + radius, y);
      c.lineTo(x + w - radius, y);
      c.quadraticCurveTo(x + w, y, x + w, y + radius);
      c.lineTo(x + w, y + h - radius);
      c.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
      c.lineTo(x + radius, y + h);
      c.quadraticCurveTo(x, y + h, x, y + h - radius);
      c.lineTo(x, y + radius);
      c.quadraticCurveTo(x, y, x + radius, y);
      c.closePath();
    }

    let width = 360;
    let height = 640;
    let dpr = Math.min(window.devicePixelRatio || 1, 2);

    const stars = Array.from({ length: 48 }, (_, i) => ({
      nx: ((i * 73) % 100) / 100,
      ny: ((i * 137) % 100) / 100,
      r: (i % 3) * 0.7 + 1,
      speed: (i % 3) * 0.35 + 0.3
    }));

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      width = Math.max(240, rect.width);
      height = Math.max(360, rect.height);
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      bird.x = width * 0.28;
      if (state === "idle") {
        bird.y = height * 0.44;
      }
    }

    let state = "idle"; // idle | playing | paused | gameover
    let soundEnabled = true;
    let score = 0;
    let bestScore = Number(localStorage.getItem("flappy_aventuras_best") || 0);
    bestScoreEl.textContent = bestScore;

    const bird = {
      x: 100,
      y: 260,
      radius: 17,
      vy: 0,
      gravity: 0.42,
      flapImpulse: -7.8,
      rotation: 0
    };

    let pipes = [];
    let frameCount = 0;
    const pipeWidth = 58;
    const pipeGap = 142;
    const pipeSpeed = 2.6;

    function playTone(freq, duration) {
      if (!soundEnabled) return;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioCtx();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "triangle";
        osc.frequency.value = freq;
        gain.gain.value = 0.06;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (_) {}
    }

    function updatePhaseBadge() {
      if (score >= 20) {
        phaseBadgeEl.textContent = "FASE 3 · AGUJERO NEGRO";
      } else if (score >= 10) {
        phaseBadgeEl.textContent = "FASE 2 · CINTURÓN ESTELAR";
      } else {
        phaseBadgeEl.textContent = "FASE 1 · NEBULOSA INICIAL";
      }
    }

    function resetGame() {
      score = 0;
      scoreEl.textContent = "0";
      updatePhaseBadge();
      pipes = [];
      frameCount = 0;
      bird.y = height * 0.44;
      bird.vy = 0;
      bird.rotation = 0;
      gameoverPanel.classList.remove("show");
      startHintEl.style.display = "block";
      state = "idle";
    }

    function flap() {
      if (state === "paused" || state === "gameover") return;
      if (state === "idle") {
        state = "playing";
        startHintEl.style.display = "none";
      }
      bird.vy = bird.flapImpulse;
      playTone(540, 0.08);
    }

    function spawnPipe() {
      const margin = 76;
      const maxTop = Math.max(margin + 30, height - pipeGap - margin);
      const topHeight = margin + Math.random() * (maxTop - margin);
      pipes.push({
        x: width + 20,
        top: topHeight,
        bottom: topHeight + pipeGap,
        passed: false
      });
    }

    function endGame() {
      if (state === "gameover") return;
      state = "gameover";
      playTone(170, 0.22);
      if (score > bestScore) {
        bestScore = score;
        localStorage.setItem("flappy_aventuras_best", String(bestScore));
      }
      finalScoreEl.textContent = score;
      bestScoreEl.textContent = bestScore;
      gameoverPanel.classList.add("show");
    }

    function update() {
      if (state !== "playing") return;

      frameCount++;
      bird.vy += bird.gravity;
      bird.y += bird.vy;
      bird.rotation = Math.max(-0.45, Math.min(1.1, bird.vy * 0.06));

      if (bird.y - bird.radius < 0) {
        bird.y = bird.radius;
        bird.vy = 0;
      }

      if (bird.y + bird.radius >= height - 22) {
        bird.y = height - 22 - bird.radius;
        endGame();
        return;
      }

      if (frameCount % 96 === 0) {
        spawnPipe();
      }

      for (let i = pipes.length - 1; i >= 0; i--) {
        const p = pipes[i];
        p.x -= pipeSpeed;

        if (!p.passed && p.x + pipeWidth < bird.x) {
          p.passed = true;
          score++;
          scoreEl.textContent = score;
          updatePhaseBadge();
          playTone(760, 0.07);
        }

        const withinX = bird.x + bird.radius > p.x && bird.x - bird.radius < p.x + pipeWidth;
        const hitTop = bird.y - bird.radius < p.top;
        const hitBottom = bird.y + bird.radius > p.bottom;

        if (withinX && (hitTop || hitBottom)) {
          endGame();
          return;
        }

        if (p.x + pipeWidth < -30) {
          pipes.splice(i, 1);
        }
      }
    }

    function drawBackground() {
      const grad = ctx.createLinearGradient(0, 0, 0, height);
      if (score >= 20) {
        grad.addColorStop(0, "#02040a");
        grad.addColorStop(0.6, "#1e1b4b");
        grad.addColorStop(1, "#3b0764");
      } else if (score >= 10) {
        grad.addColorStop(0, "#050814");
        grad.addColorStop(0.6, "#0f172a");
        grad.addColorStop(1, "#1d4ed8");
      } else {
        grad.addColorStop(0, "#050814");
        grad.addColorStop(0.55, "#0f172a");
        grad.addColorStop(1, "#1e1b4b");
      }
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, width, height);

      // Planeta de fondo
      ctx.fillStyle = "rgba(129, 140, 248, 0.16)";
      ctx.beginPath();
      ctx.arc(width * 0.76, height * 0.28, Math.min(width, height) * 0.14, 0, Math.PI * 2);
      ctx.fill();

      // Estrellas
      for (const s of stars) {
        const sx = (((s.nx * width) - frameCount * s.speed) % width + width) % width;
        const sy = s.ny * (height - 30);
        ctx.fillStyle = "rgba(248, 250, 252, 0.78)";
        ctx.beginPath();
        ctx.arc(sx, sy, s.r, 0, Math.PI * 2);
        ctx.fill();
      }

      // Franja inferior espacial
      ctx.fillStyle = "#1e1b4b";
      ctx.fillRect(0, height - 22, width, 22);
      ctx.fillStyle = "#38bdf8";
      ctx.fillRect(0, height - 22, width, 3);
    }

    function drawPipes() {
      for (const p of pipes) {
        ctx.fillStyle = "#0ea5e9";
        drawRoundRect(ctx, p.x, 0, pipeWidth, p.top, 8);
        ctx.fill();

        ctx.fillStyle = "#7dd3fc";
        drawRoundRect(ctx, p.x - 4, Math.max(0, p.top - 22), pipeWidth + 8, 22, 6);
        ctx.fill();

        const bottomH = Math.max(0, height - 22 - p.bottom);
        ctx.fillStyle = "#0ea5e9";
        drawRoundRect(ctx, p.x, p.bottom, pipeWidth, bottomH, 8);
        ctx.fill();

        ctx.fillStyle = "#7dd3fc";
        drawRoundRect(ctx, p.x - 4, p.bottom, pipeWidth + 8, 22, 6);
        ctx.fill();
      }
    }

    function drawBird() {
      ctx.save();
      ctx.translate(bird.x, bird.y);
      ctx.rotate(bird.rotation);

      ctx.fillStyle = "#38bdf8";
      ctx.beginPath();
      ctx.arc(0, 0, bird.radius, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(6, -4, 5.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#0f172a";
      ctx.beginPath();
      ctx.arc(7.5, -4, 2.6, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#fbbf24";
      ctx.beginPath();
      ctx.moveTo(bird.radius - 2, -1);
      ctx.lineTo(bird.radius + 11, 3);
      ctx.lineTo(bird.radius - 2, 8);
      ctx.closePath();
      ctx.fill();

      ctx.restore();
    }

    function loop() {
      update();
      drawBackground();
      drawPipes();
      drawBird();
      requestAnimationFrame(loop);
    }

    canvas.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      flap();
    });

    window.addEventListener("keydown", (e) => {
      if (e.code === "Space" || e.code === "ArrowUp") {
        e.preventDefault();
        flap();
      }
    });

    pauseBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      if (state === "playing") {
        state = "paused";
        pauseBtn.textContent = "▶";
      } else if (state === "paused") {
        state = "playing";
        pauseBtn.textContent = "II";
      }
    });

    soundBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      soundEnabled = !soundEnabled;
      soundBtn.textContent = soundEnabled ? "♪" : "✕";
    });

    restartBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      pauseBtn.textContent = "II";
      resetGame();
    });

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();
    loop();

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
